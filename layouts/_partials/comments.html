<section class="comments" aria-label="{{ if eq .Language.Lang "ko" }}댓글{{ else }}Comments{{ end }}">
  <h2>{{ if eq .Language.Lang "ko" }}댓글{{ else }}Comments{{ end }}</h2>
  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
          data-repo="dadak797/dadak797.github.io"
          data-repo-id="R_kgDOTces9Q"
          data-category="Announcements"
          data-category-id="DIC_kwDOTces9c4DFqoj"
          data-mapping="pathname"
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="{{ .Language.Lang }}"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
  <script>
    (() => {
      const comments = document.querySelector('.giscus');
      const themeToggle = document.getElementById('theme-toggle');

      const syncGiscusTheme = () => {
        const frame = document.querySelector('.giscus-frame');
        if (!frame) return;

        const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        frame.contentWindow.postMessage({
          giscus: { setConfig: { theme } }
        }, 'https://giscus.app');
      };

      const observer = new MutationObserver(() => {
        const frame = document.querySelector('.giscus-frame');
        if (!frame) return;

        frame.addEventListener('load', syncGiscusTheme);
        syncGiscusTheme();
        observer.disconnect();
      });

      observer.observe(comments, { childList: true });
      themeToggle?.addEventListener('click', () => setTimeout(syncGiscusTheme, 0));
    })();
  </script>
</section>
